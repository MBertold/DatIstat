services:
  # =========================================================================
  # 1. POSTGRESQL (Backend database per i metadati di Apache Airflow)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: datistat_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # 2. AIRFLOW INIT (Migrazione database & creazione utente admin)
  # =========================================================================
  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    container_name: datistat_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Marco
      _AIRFLOW_WWW_USER_LASTNAME: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@datistat.local
      _AIRFLOW_WWW_USER_ROLE: Admin
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb pyarrow scikit-learn pandas requests"
    command: version

  # =========================================================================
  # 3. AIRFLOW WEBSERVER (Interfaccia grafica di orchestrazione - Porta 8080)
  # =========================================================================
  airflow-webserver:
    image: apache/airflow:2.9.2-python3.11
    container_name: datistat_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb pyarrow scikit-learn pandas requests"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./run_pipeline.py:/opt/airflow/run_pipeline.py
    command: webserver
    restart: unless-stopped

  # =========================================================================
  # 4. AIRFLOW SCHEDULER (Gestione esecuzione programmata dei DAG)
  # =========================================================================
  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    container_name: datistat_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb pyarrow scikit-learn pandas requests"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./run_pipeline.py:/opt/airflow/run_pipeline.py
    command: scheduler
    restart: unless-stopped

  # =========================================================================
  # 5. STREAMLIT APP (Dashboard interattiva di Business Intelligence - Porta 8501)
  # =========================================================================
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datistat_streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./src:/app/src
    restart: unless-stopped

volumes:
  postgres-data:
